# =============================
#               R3
# =============================
# --- VXLAN ---
ip link add br0 type bridge ip link set dev br0 up
ip link add vxlan10 type vxlan id 10 dstport 4789 ip link set dev vxlan10 up
brctl addif br0 vxlan10 brctl addif br0 eth0

#  --- FRRouting --- 
vtysh conf t

#  --- Net Host 1 --- 
interface eth0 ip address 10.0.3.1/24

#  --- R3 -> RR --- 
interface eth2 ip address 10.10.3.1/30 ip ospf area 0

#  --- Loopback R3 --- 
interface lo ip address 1.1.1.4/32 ip ospf area 0

#  --- BGP -> RR --- 
router bgp 1 neighbor 1.1.1.1 remote-as 1 neighbor 1.1.1.1 update-source lo

#  --- EVPN  -> RR--- 
address-family l2vpn evpn neighbor 1.1.1.1 activate advertise-all-vni exit-address-family